steps:
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/$PROJECT_ID/mcp-server:$COMMIT_SHA', '.']
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/$PROJECT_ID/mcp-server:$COMMIT_SHA']
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
  - 'run'
  - 'deploy'
  - 'mcp-server'
  - '--image'
  - 'gcr.io/$PROJECT_ID/mcp-server:$COMMIT_SHA'
  - '--region'
  - 'us-central1'
  - '--platform'
  - 'managed'
  - '--allow-unauthenticated'
  - '--set-env-vars'
  - 'MCP_AUTH_TOKEN=your-secure-token'
  - '--service-account'
  - 'mcp-service@salon-autonomous-ai-467811.iam.gserviceaccount.com'
options:
  logging: CLOUD_LOGGING_ONLY
